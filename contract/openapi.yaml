# Template: replace with the project's contract. Sign it with `python scripts/contract.py register --version 1`.
openapi: 3.1.0
info:
  title: Project API
  version: "0"
paths:
  /examples:
    post:
      summary: Creates an example
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewExample" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Example" }
        "422":
          description: Invalid data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
components:
  schemas:
    NewExample:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
    Example:
      type: object
      required: [id, name, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
